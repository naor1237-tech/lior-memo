<section class="sec oud-sec" id="oud">
  <div class="wrap">
    <div class="sec-head">
      <div class="rv"><span class="label">הכירו את העוד</span><h2 class="h2">נסו לנגן<br><em>בעצמכם.</em></h2></div>
      <p class="lede rv">העוד הוא המלך של המוזיקה המזרחית ושל הפיוט. העבירו את האצבע על המיתרים, בחרו מקאם ונגנו – הצלילים נוצרים בזמן אמת בדפדפן.</p>
    </div>

    <div class="oud-grid">
      <figure class="oud-fig rv" aria-label="איור של כלי הנגינה עוד">
        <svg class="oud-svg" viewBox="0 0 1000 420" role="img" aria-labelledby="oudT">
          <title id="oudT">עוד – כלי פריטה מזרחי עם צוואר ללא סריגים, קערה עגולה ושושנות קול</title>
          <defs>
            <radialGradient id="oudTop" cx="62%" cy="45%" r="60%"><stop offset="0" stop-color="#e6c08a"/><stop offset=".6" stop-color="#c08a4c"/><stop offset="1" stop-color="#7a4b22"/></radialGradient>
            <linearGradient id="oudNeck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3518"/><stop offset=".5" stop-color="#3b2210"/><stop offset="1" stop-color="#24140a"/></linearGradient>
            <linearGradient id="oudStr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3e3bb"/><stop offset="1" stop-color="#c9a96a"/></linearGradient>
            <filter id="oudSh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
          </defs>
          <g filter="url(#oudSh)">
            <!-- pegbox (bent back) -->
            <path d="M150 188 L150 232 L62 330 Q50 344 36 332 L28 322 Q20 310 32 298 Z" fill="url(#oudNeck)" stroke="#1a0f07" stroke-width="3"/>
            <g fill="#e9d8b4" stroke="#3a2210" stroke-width="2">
              <circle cx="128" cy="236" r="7"/><circle cx="108" cy="258" r="7"/><circle cx="88" cy="280" r="7"/><circle cx="68" cy="302" r="7"/><circle cx="48" cy="322" r="7"/>
            </g>
            <!-- neck -->
            <path d="M150 186 L500 176 L500 244 L150 234 Z" fill="url(#oudNeck)" stroke="#1a0f07" stroke-width="3"/>
            <!-- body / soundboard -->
            <path d="M470 210 C480 118 600 40 720 44 C866 50 962 130 962 210 C962 290 866 370 720 376 C600 380 480 302 470 210 Z" fill="url(#oudTop)" stroke="#3a2210" stroke-width="7"/>
            <path d="M486 210 C496 128 608 58 720 61 C852 66 944 140 944 210 C944 280 852 354 720 359 C608 362 496 292 486 210 Z" fill="none" stroke="#2a180a" stroke-opacity=".45" stroke-width="2" stroke-dasharray="2 5"/>
            <!-- fingerboard over the body -->
            <path d="M150 190 L590 180 L590 240 L150 230 Z" fill="#160d07"/>
            <rect x="148" y="186" width="7" height="48" fill="#efe2c4"/>
            <!-- rosettes (shamsa) -->
            <g transform="translate(672 210)">
              <circle r="52" fill="#2a180a"/><circle r="52" fill="none" stroke="#e6c08a" stroke-width="3"/>
              <g fill="none" stroke="#e6c08a" stroke-width="2.2" opacity=".9">
                <circle r="40"/><circle r="22"/>
                <path d="M0-40 L11-11 L40 0 L11 11 L0 40 L-11 11 L-40 0 L-11-11Z"/>
                <path d="M28-28 L4-10 L-28-28 L-10-4 L-28 28 L-4 10 L28 28 L10 4Z" transform="rotate(0)"/>
              </g>
            </g>
            <g fill="#2a180a" stroke="#e6c08a" stroke-width="2"><circle cx="780" cy="118" r="17"/><circle cx="780" cy="302" r="17"/></g>
            <!-- pick guard -->
            <path d="M738 236 Q770 272 830 262 Q812 236 790 226 Z" fill="#1b0f07" opacity=".8"/>
            <!-- bridge -->
            <rect x="860" y="174" width="22" height="72" rx="4" fill="#24140a" stroke="#120a04" stroke-width="2"/>
            <!-- strings: 6 courses, low (bottom) to high (top) -->
            <g stroke="url(#oudStr)" stroke-linecap="round">
              <line class="str" x1="152" y1="229" x2="868" y2="238" stroke-width="3.2"/>
              <line class="str" x1="152" y1="222" x2="868" y2="226" stroke-width="2.8"/>
              <line class="str" x1="152" y1="215" x2="868" y2="214" stroke-width="2.4"/>
              <line class="str" x1="152" y1="208" x2="868" y2="202" stroke-width="2"/>
              <line class="str" x1="152" y1="201" x2="868" y2="190" stroke-width="1.7"/>
              <line class="str" x1="152" y1="194" x2="868" y2="178" stroke-width="1.4"/>
            </g>
            <ellipse cx="760" cy="130" rx="120" ry="46" fill="#fff" opacity=".07" transform="rotate(-14 760 130)"/>
          </g>
        </svg>
        <figcaption>
          <b>מה זה עוד?</b>
          <p>״אל-עוּד״ בערבית פירושו ״העץ״. זהו כלי פריטה עתיק עם קערה עגולה ועמוקה העשויה מצלעות עץ, ומשטח קול עם שושנות מגולפות. ממנו התפתחה הלאוטה האירופית.</p>
          <ul class="oud-facts">
            <li><b>צוואר בלי סריגים</b><span>מאפשר רבעי טונים – הצלילים שבין הקלידים של הפסנתר, שנותנים לפיוט את הצבע המזרחי.</span></li>
            <li><b>11 מיתרים</b><span>חמישה זוגות ומיתר בס בודד, שמכוונים בדרך כלל לדו־פה־לה־רה־סול־דו.</span></li>
            <li><b>ריש׳ה</b><span>מפרט ארוך וגמיש שבו פורטים – ומשם הצליל החם והנשיפתי.</span></li>
          </ul>
        </figcaption>
      </figure>

      <div class="oud-play rv">
        <div class="strum" role="group" aria-label="מיתרי העוד – העבירו את האצבע או לחצו כדי לפרוט">
          <span class="hint">החליקו על המיתרים ↕</span>
          <button type="button" class="s" style="--w:1.4px" aria-label="מיתר דו גבוה"><i></i><em>דו</em></button>
          <button type="button" class="s" style="--w:1.7px" aria-label="מיתר סול"><i></i><em>סול</em></button>
          <button type="button" class="s" style="--w:2px" aria-label="מיתר רה"><i></i><em>רה</em></button>
          <button type="button" class="s" style="--w:2.4px" aria-label="מיתר לה"><i></i><em>לה</em></button>
          <button type="button" class="s" style="--w:2.8px" aria-label="מיתר פה"><i></i><em>פה</em></button>
          <button type="button" class="s" style="--w:3.2px" aria-label="מיתר דו נמוך (בס)"><i></i><em>דו</em></button>
        </div>
        <div class="maqam">
          <div class="mq-tabs" role="group" aria-label="בחירת מקאם">
            <button type="button" class="mq" data-m="rast" aria-pressed="true">ראסט</button>
            <button type="button" class="mq" data-m="bayati" aria-pressed="false">ביאתי</button>
            <button type="button" class="mq" data-m="hijaz" aria-pressed="false">חיג׳אז</button>
            <button type="button" class="mq" data-m="saba" aria-pressed="false">סבא</button>
            <button type="button" class="mq" data-m="nahawand" aria-pressed="false">נהוונד</button>
          </div>
          <p class="mood"></p>
          <div class="pads"></div>
          <div class="mq-foot">
            <button type="button" class="btn btn-solid taqsim">▶ נגנו טקסים קצר</button>
            <span>אפשר גם במקלדת: 1–8</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
