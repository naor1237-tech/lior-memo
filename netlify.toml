[build]
  publish = "."

# Large videos are streamed from the GitHub Pages mirror of this repo (Netlify upload size limit).
[[redirects]]
  from = "/c"
  to = "/card/"
  status = 301

[[redirects]]
  from = "/r"
  to = "/review/"
  status = 301

[[redirects]]
  from = "/v/*"
  to = "https://naor1237-tech.github.io/lior-memo/media/:splat"
  status = 200
  force = true

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/lior-mamo.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=lior-mamo.vcf"

[[headers]]
  for = "/files/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
