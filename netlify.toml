[build]
  publish = "."

# Large videos are streamed from the GitHub Pages mirror of this repo (Netlify upload size limit).
[[redirects]]
  from = "/c"
  to = "/card/"
  status = 301

[[redirects]]
  from = "/r"
  to = "/review/"
  status = 301

[[redirects]]
  from = "/v/*"
  to = "https://naor1237-tech.github.io/lior-memo/media/:splat"
  status = 200
  force = true

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/lior-mamo.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=lior-mamo.vcf"

[[headers]]
  for = "/files/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# כותרות אבטחה לכל הדפים
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# קבצים פנימיים (הוראות לעבודה עם Claude, מחוללי הדפים, סקריפט פריסה) לא נגישים מהאתר
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.mcp.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/deploy-netlify.sh"
  to = "/404.html"
  status = 404
  force = true
